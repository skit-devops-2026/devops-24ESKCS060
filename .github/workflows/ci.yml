name: Weather Dashboard CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test-and-lint:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Code Linting & Syntax Checks
        run: |
          python -m py_compile src/*.py tests/*.py

      - name: Execute Automated Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  docker-build:
    name: Build Container Image
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile & Build Image
        run: |
          docker build -t weather-dashboard:${{ github.sha }} .
          docker build -t weather-dashboard:latest .

      - name: Container Registry Push Confirmation
        run: |
          echo "Build & tests succeeded cleanly for ${{ github.sha }}"
