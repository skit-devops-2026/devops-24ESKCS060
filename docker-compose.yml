version: '3.8'

services:
  weather-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weather-dashboard-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - devops-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: weather-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - weather-app
    networks:
      - devops-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: weather-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/weather-dashboard.json:ro
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - devops-net

networks:
  devops-net:
    driver: bridge
