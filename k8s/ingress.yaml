apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather-dashboard-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: weather.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: weather-dashboard-service
                port:
                  number: 8080
